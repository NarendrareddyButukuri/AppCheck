version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: appcheck-db
    restart: always
    environment:
      POSTGRES_USER: appcheck
      POSTGRES_PASSWORD: appcheck_secure_password_2026
      POSTGRES_DB: appcheck_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appcheck -d appcheck_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: appcheck-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://appcheck:appcheck_secure_password_2026@db:5432/appcheck_db
      - SECRET_KEY=appcheck-production-security-super-secret-key-32charsmin
      - PROJECT_NAME=AppCheck
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    volumes:
      - appcheck_uploads:/app/backend/uploads
      - appcheck_reports:/app/backend/generated_reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appcheck-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  appcheck_uploads:
  appcheck_reports:
